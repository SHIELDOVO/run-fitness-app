<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RUN · 健身 App 高保真交互原型（暗色）</title>
<style>
  :root{
    --run:#FF5436; --run-2:#FF8A5B; --run-grad:linear-gradient(135deg,#FF8A5B 0%,#FF3D2E 100%);
    --bg:#05070A; --screen:#0E1016; --surface:#161922; --surface-2:#1D212C; --line:#262A36;
    --ink:#F3F4F8; --ink-2:#9AA1B1; --muted:#6B7280;
    --green:#2EE6A6; --blue:#5B9BFF; --shadow:0 22px 50px rgba(0,0,0,.55); --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    background:radial-gradient(900px 500px at 50% -10%,#15171f 0%,var(--bg) 60%);
    color:var(--ink); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px 12px 40px; gap:18px;
  }
  .stage-label{font-size:13px;color:var(--ink-2);letter-spacing:1px;text-align:center}
  .stage-label b{color:var(--run)}

  /* minimal line icons */
  .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
  .ic.xs{width:13px;height:13px;stroke-width:1.6}
  .ic.sm{width:18px;height:18px}

  /* Phone */
  .phone{width:330px;height:690px;background:#05070A;border-radius:46px;padding:11px;box-shadow:var(--shadow),inset 0 0 0 1px #1b1f29;position:relative;flex-shrink:0}
  .phone::after{content:"";position:absolute;right:-3px;top:130px;width:3px;height:60px;background:#05070A;border-radius:0 3px 3px 0}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:26px;background:#05070A;border-radius:0 0 16px 16px;z-index:30}
  .screen{background:var(--screen);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;height:100%;position:relative}

  .statusbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:var(--ink-2);flex-shrink:0;z-index:20}
  .statusbar.light{color:#fff}
  .statusbar .right{display:flex;align-items:center;gap:5px}

  .view-port{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column;scrollbar-width:none}
  .view-port::-webkit-scrollbar{display:none}
  .view-anim{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* bottom tab bar */
  .tabbar{background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-around;padding:7px 6px 13px;flex-shrink:0;position:relative}
  .tabbar .item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;width:58px;cursor:pointer}
  .tabbar .item.active{color:var(--run)}
  .tabbar .center{margin-top:-22px}
  .tabbar .center .fab{width:54px;height:54px;border-radius:50%;background:var(--run-grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 20px rgba(255,84,54,.45);font-weight:800;font-size:14px;cursor:pointer}
  .tabbar .center .lab{color:var(--run);font-size:10px;font-weight:700;margin-top:5px}

  /* common */
  .section-title{font-size:15px;font-weight:800;color:var(--ink);margin:18px 0 12px;display:flex;align-items:center;justify-content:space-between}
  .section-title .more{font-size:11px;color:var(--muted);font-weight:600}
  .pad{padding:0 18px}
  .img{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .img img{width:100%;height:100%;object-fit:cover;display:block}
  .img .badge{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:3px 8px;border-radius:8px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:11px;padding:5px 11px;border-radius:999px;font-weight:600}
  .chip.active{background:var(--ink);color:#0E1016;border-color:var(--ink)}
  .card{background:var(--surface);border-radius:18px;padding:14px;border:1px solid var(--line)}
  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
  .a1{background:linear-gradient(135deg,#FF8A5B,#FF3D2E)} .a2{background:linear-gradient(135deg,#5B9BFF,#1E40AF)} .a3{background:linear-gradient(135deg,#2EE6A6,#0E9F66)} .a4{background:linear-gradient(135deg,#B57BFF,#7E22CE)} .a5{background:linear-gradient(135deg,#F5B042,#D97706)}
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex-shrink:0}
  .back{width:30px;height:30px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.3);flex-shrink:0;color:var(--ink);cursor:pointer}
  .topbar h2{font-size:17px;font-weight:800}
  .topbar .right{margin-left:auto;color:var(--ink-2);display:flex;align-items:center;gap:12px}
  .btn-primary{background:var(--run-grad);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;width:100%;box-shadow:0 10px 20px rgba(255,84,54,.3);text-align:center;cursor:pointer}
  .follow.following{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .post .stats .s.liked{color:var(--run)}
  .tabs .t{cursor:pointer}

  /* Wallpaper */
  .wall{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#23262f 0%,#0c0e14 70%)}
  .wall .wall-bg{position:absolute;inset:0;opacity:.34;background-size:cover;background-position:center 30%}
  .wall .wall-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.28),rgba(8,10,14,.72))}
  .wall .widgets{position:relative;display:flex;gap:9px;padding:14px 18px 0;z-index:2}
  .wall .widgets>div{background:rgba(20,22,28,.42);border:1px solid rgba(255,255,255,.10);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .wall .wcal{width:78px;text-align:center;padding:9px 0 8px}
  .wall .wcal .wk{font-size:11px;color:var(--run-2);font-weight:700}
  .wall .wcal .wd{font-size:38px;font-weight:200;line-height:1.02}
  .wall .wcal .wm{font-size:10px;opacity:.75}
  .wall .wweather{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 14px}
  .wall .wweather .ww{font-size:30px;font-weight:300;line-height:1.05}
  .wall .wweather .wl{font-size:12px;opacity:.92;margin-top:3px;font-weight:600}
  .wall .wweather .wh{font-size:10px;opacity:.65;margin-top:2px}
  .wall .app-grid{position:relative;flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;align-content:center;justify-items:center;padding:10px 16px 0;z-index:2}
  .wall .app{width:62px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .wall .app .ico{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255,255,255,.08)}
  .wall .app .ico .ic{width:26px;height:26px}
  .wall .app .nm{font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap}
  .wall .app.c-blue .ico{background:linear-gradient(145deg,#4facfe,#0a84ff)}
  .wall .app.c-green .ico{background:linear-gradient(145deg,#5ceb6b,#1fae4b)}
  .wall .app.c-indigo .ico{background:linear-gradient(145deg,#7d8cff,#4a56d8)}
  .wall .app.c-orange .ico{background:linear-gradient(145deg,#ff9a44,#f4511e)}
  .wall .app.c-pink .ico{background:linear-gradient(145deg,#ff7eb3,#e5348b)}
  .wall .app.c-purple .ico{background:linear-gradient(145deg,#b388ff,#7c4dff)}
  .wall .app.c-gray .ico{background:linear-gradient(145deg,#8e9ba8,#5a6672)}
  .wall .app.run .ico{background:var(--run-grad);font-weight:900;font-size:26px;border:none;box-shadow:0 8px 22px rgba(255,84,54,.55);animation:bob 1.6s ease-in-out infinite}
  .wall .app.run .nm{color:#fff;font-weight:700}
  .wall .dots{position:relative;display:flex;gap:7px;justify-content:center;margin:0 0 12px;z-index:2}
  .wall .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
  .wall .dots i.on{background:#fff}
  .wall .dock{position:relative;display:flex;gap:16px;justify-content:center;align-items:center;margin:0 16px 14px;padding:12px 16px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.10);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:2}
  .wall .dock .d{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25)}
  .wall .dock .d .ic{width:24px;height:24px}
  .wall .home-ind{position:relative;width:108px;height:4px;border-radius:3px;background:rgba(255,255,255,.85);margin:2px auto 9px;z-index:2}

  /* Flash & splash */
  .flash{position:absolute;inset:0;background:var(--run-grad);display:flex;align-items:center;justify-content:center;text-align:center;gap:18px;flex-direction:column}
  .flash .mark{width:120px;height:120px;border-radius:30px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:44px;letter-spacing:1px;animation:pop .6s ease}
  .flash .ring{width:54px;height:54px}
  .flash .ld{font-size:11px;color:rgba(255,255,255,.85);letter-spacing:3px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .splash{position:absolute;inset:0;background:var(--run-grad);color:#fff;display:flex;flex-direction:column;text-align:center;padding:54px 26px 30px;justify-content:space-between}
  .splash .sp-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .splash .hero{width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;overflow:hidden;border:6px solid rgba(255,255,255,.25)}
  .splash .hero img{width:100%;height:100%;object-fit:cover}
  .splash .appname{font-size:40px;font-weight:900;letter-spacing:2px}
  .splash .tagline{font-size:13px;opacity:.92;line-height:1.7;margin-top:16px}
  .splash .pills{display:flex;gap:12px;width:100%}
  .splash .pills .b{flex:1;padding:14px;border-radius:16px;font-weight:800;font-size:15px;cursor:pointer}
  .splash .pills .w{background:#fff;color:var(--run)}
  .splash .pills .o{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5)}
  .splash .dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
  .splash .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
  .splash .dots i.on{width:18px;background:#fff;border-radius:4px}

  /* Feed */
  .tabs{display:flex;gap:6px;padding:4px 16px 0;overflow:hidden}
  .tabs .t{font-size:13px;color:var(--muted);font-weight:700;padding:6px 4px}
  .tabs .t.on{color:var(--ink);border-bottom:2px solid var(--run);padding-bottom:8px}
  .quick-acts{display:flex;gap:10px;padding:12px 16px}
  .quick-acts .qa{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;color:var(--ink-2);cursor:pointer}
  .quick-acts .qa.run{border-color:var(--run);color:var(--run);background:rgba(255,84,54,.08)}
  .quick-acts .qa .l{font-size:11px;font-weight:700;margin-top:5px}
  .post{margin:0 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
  .post .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .post .head .name{font-weight:800;font-size:14px}
  .post .head .meta{color:var(--muted);font-size:11px}
  .post .head .follow{margin-left:auto;background:var(--run-grad);color:#fff;font-size:11px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer}
  .post .title{font-size:16px;font-weight:800;margin-bottom:8px}
  .post .media{height:150px;border-radius:16px;overflow:hidden;margin-bottom:10px}
  .post .stats{display:flex;gap:16px;color:var(--muted);font-size:12px}
  .post .stats .s{display:flex;align-items:center;gap:5px}
  .post .stats b{color:var(--ink-2);font-weight:700}
  .course-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer}
  .course-row .thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;flex-shrink:0}
  .course-row .thumb img{width:100%;height:100%;object-fit:cover}
  .course-row .ct .t{font-weight:800;font-size:14px}
  .course-row .ct .d{color:var(--muted);font-size:11px;margin-top:3px}
  .course-row .go{margin-left:auto;color:var(--run);font-weight:800;font-size:12px}
  .rec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .rec-grid .g{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
  .rec-grid .g img{width:100%;height:100%;object-fit:cover}
  .rec-grid .g span{position:absolute;left:6px;bottom:6px;color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}

  /* video carousel */
  .vcarousel{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
  .vcarousel::-webkit-scrollbar{display:none}
  .vcard{width:132px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
  .vcard .th{height:84px;position:relative;overflow:hidden}
  .vcard .th img{width:100%;height:100%;object-fit:cover}
  .vcard .th .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;color:#fff}
  .vcard .th .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px}
  .vcard .ct{padding:7px 9px}
  .vcard .ct .t{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vcard .ct .a{font-size:10px;color:var(--muted);margin-top:2px}

  /* Training */
  .train-hero{height:170px;overflow:hidden;position:relative}
  .train-hero img{width:100%;height:100%;object-fit:cover}
  .train-hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.5));display:flex;align-items:flex-end;padding:14px}
  .train-hero .ov .tt{color:#fff;font-size:18px;font-weight:900}
  .pills-row{display:flex;gap:8px;padding:12px 16px}
  .pills-row .p{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
  .pills-row .p .n{font-size:18px;font-weight:900}
  .pills-row .p .l{font-size:10px;color:var(--muted);margin-top:2px}
  .today-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer}
  .today-row .ic{width:46px;height:46px;border-radius:14px;background:var(--run-grad);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .today-row .ct .t{font-weight:800;font-size:14px}
  .today-row .ct .d{color:var(--muted);font-size:11px;margin-top:2px}
  .today-row .btn{margin-left:auto;background:var(--surface-2);border:1px solid var(--run);color:var(--run);font-size:11px;font-weight:800;padding:7px 12px;border-radius:999px}
  .newproj{height:120px;margin:0 16px;border-radius:16px;overflow:hidden;position:relative}
  .newproj img{width:100%;height:100%;object-fit:cover}
  .newproj .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.55));display:flex;align-items:flex-end;padding:14px}
  .newproj .ov .tt{color:#fff;font-size:16px;font-weight:900}

  /* Project detail */
  .pjhero{height:200px;position:relative;overflow:hidden;cursor:pointer}
  .pjhero img{width:100%;height:100%;object-fit:cover}
  .pjhero .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff}
  .pjtabs{display:flex;gap:18px;padding:14px 18px 0}
  .pjtabs .t{font-size:13px;color:var(--muted);font-weight:700}
  .pjtabs .t.on{color:var(--ink);border-bottom:2px solid var(--run);padding-bottom:8px}
  .addbtn{margin:14px 16px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1.5px dashed var(--run);color:var(--run);font-weight:800;padding:14px;border-radius:16px;cursor:pointer}

  /* Create profile */
  .create-head{background:var(--run-grad);color:#fff;padding:18px 18px 40px;text-align:center}
  .create-upload{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.2);border:3px dashed rgba(255,255,255,.6);margin:8px auto 0;display:flex;align-items:center;justify-content:center;color:#fff}
  .create-name{font-size:18px;font-weight:800;margin-top:12px}
  .create-body{background:var(--surface);margin:-24px 14px 0;border-radius:20px;padding:18px;border:1px solid var(--line)}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 16px}
  .metrics .m{background:var(--surface-2);border-radius:14px;padding:12px 8px;text-align:center}
  .metrics .m .v{font-size:18px;font-weight:900;color:var(--run-2)}
  .metrics .m .l{font-size:10px;color:var(--muted);margin-top:2px}
  .form .f{display:flex;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .form .f .k{color:var(--muted);font-size:13px;width:64px}
  .form .f .v{flex:1;font-size:14px;font-weight:600}

  /* Profile */
  .profile-head{background:var(--run-grad);padding:30px 18px 22px;text-align:center;color:#fff}
  .profile-head .av{width:84px;height:84px;border-radius:50%;border:3px solid rgba(255,255,255,.6);margin:0 auto;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
  .profile-head .nm{font-size:19px;font-weight:900;margin-top:10px}
  .profile-head .id{font-size:11px;opacity:.85;margin-top:3px}
  .tagrow{display:flex;gap:10px;padding:14px 16px;overflow:hidden}
  .tagrow .tg{flex:1;text-align:center;cursor:pointer}
  .tagrow .tg .c{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#fff}
  .tagrow .tg .l{font-size:11px;color:var(--ink-2);font-weight:600}
  .data-tabs{display:flex;gap:14px;padding:0 18px}
  .data-tabs .t{font-size:12px;color:var(--muted);font-weight:700}
  .data-tabs .t.on{color:var(--ink);border-bottom:2px solid var(--run);padding-bottom:6px}
  .menu{margin:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .menu .mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .menu .mi:last-child{border-bottom:none}
  .menu .mi .ic{color:var(--run)}
  .menu .mi .t{font-size:14px;font-weight:600}
  .menu .mi .go{margin-left:auto;color:var(--muted);font-size:12px}
  .proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 16px}
  .proj-grid .pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
  .proj-grid .pc .ph{height:84px;overflow:hidden}
  .proj-grid .pc .ph img{width:100%;height:100%;object-fit:cover}
  .proj-grid .pc .ct{padding:9px 11px}
  .proj-grid .pc .ct .t{font-size:12px;font-weight:800}
  .proj-grid .pc .ct .v{font-size:13px;font-weight:900;color:var(--run-2);margin-top:2px}

  /* Favorites */
  .fav-tabs{display:flex;gap:8px;padding:12px 16px 0}
  .fav-tabs .t{font-size:13px;color:var(--muted);font-weight:700;padding:6px 10px;border-radius:999px}
  .fav-tabs .t.on{background:var(--ink);color:#0E1016}
  .fav-sort{display:flex;align-items:center;gap:6px;padding:10px 16px;color:var(--muted);font-size:12px}
  .fav-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer}
  .fav-row .th{width:50px;height:50px;border-radius:12px;overflow:hidden;flex-shrink:0}
  .fav-row .th img{width:100%;height:100%;object-fit:cover}
  .fav-row .ct .t{font-weight:800;font-size:13.5px}
  .fav-row .ct .m{color:var(--muted);font-size:11px;margin-top:3px}
  .fav-row .more{margin-left:auto;color:var(--muted)}

  /* Article */
  .article-hero{height:200px;position:relative;overflow:hidden}
  .article-hero img{width:100%;height:100%;object-fit:cover}
  .author{display:flex;align-items:center;gap:10px;padding:14px 18px}
  .author .nm{font-weight:800;font-size:14px}
  .author .mt{color:var(--muted);font-size:11px}
  .author .follow{margin-left:auto;background:var(--run-grad);color:#fff;font-size:11px;font-weight:800;padding:7px 16px;border-radius:999px;cursor:pointer}
  .article h3{font-size:19px;font-weight:900;padding:4px 18px 8px}
  .article-body{padding:0 18px;color:var(--ink-2);font-size:13.5px;line-height:1.8}
  .article-body p{margin-bottom:10px}
  .comment-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
  .comment-bar .inp{flex:1;background:var(--surface-2);border-radius:999px;padding:10px 16px;color:var(--muted);font-size:13px}
  .comment-bar .send{color:var(--run);font-weight:800;font-size:13px;cursor:pointer}
  .cmt{padding:12px 18px;display:flex;gap:10px;border-top:1px solid var(--line);background:var(--surface)}
  .cmt .ct .nm{font-weight:800;font-size:12.5px}
  .cmt .ct .tx{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.6}
  .cmt .ct .mt{font-size:10px;color:var(--muted);margin-top:5px}

  /* Author */
  .author-top{background:var(--run-grad);padding:24px 18px 22px;text-align:center;color:#fff}
  .author-top .av{width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.6);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:rgba(255,255,255,.2);overflow:hidden}
  .author-top .nm{font-size:18px;font-weight:900;margin-top:10px}
  .author-top .ds{font-size:11px;opacity:.85;margin-top:5px}
  .author-stats{display:flex;justify-content:space-around;background:var(--surface);padding:14px 0;margin:0 14px;margin-top:-18px;border-radius:16px;border:1px solid var(--line);position:relative;z-index:2}
  .author-stats .s{text-align:center}
  .author-stats .s .v{font-size:17px;font-weight:900}
  .author-stats .s .l{font-size:10px;color:var(--muted);margin-top:2px}
  .author-tabs{display:flex;gap:14px;padding:14px 18px 4px}
  .author-tabs .t{font-size:13px;color:var(--muted);font-weight:700}
  .author-tabs .t.on{color:var(--ink);border-bottom:2px solid var(--run);padding-bottom:6px}
  .reply-card{margin:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
  .reply-card .inp{width:100%;border:none;background:var(--surface-2);border-radius:12px;padding:12px;font-size:13px;outline:none;resize:none;color:var(--ink)}
  .reply-card .row{display:flex;justify-content:flex-end;margin-top:10px}
  .reply-card .row button{background:var(--surface-2);border:1px solid var(--run);color:var(--run);border-radius:12px;padding:9px 22px;font-weight:800;font-size:13px;cursor:pointer}

  /* Workout stats */
  .ws-head{padding:6px 16px;display:flex;align-items:center}
  .ws-head .tabs .t{font-size:15px;color:var(--muted);font-weight:800}
  .ws-head .tabs .t.on{color:var(--ink)}
  .week{display:flex;justify-content:space-around;padding:10px 12px}
  .week .d{text-align:center}
  .week .d .day{font-size:10px;color:var(--muted)}
  .week .d .num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:4px;color:var(--ink-2)}
  .week .d.on .num{background:var(--run-grad);color:#fff}
  .donut-wrap{display:flex;align-items:center;gap:16px;padding:6px 18px 14px}
  .donut{position:relative;width:150px;height:150px;flex-shrink:0}
  .donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut .ctr .v{font-size:24px;font-weight:900}
  .donut .ctr .l{font-size:11px;color:var(--muted)}
  .bubbles{flex:1;display:flex;flex-direction:column;gap:10px}
  .bubbles .b{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .bubbles .b .l{font-size:10px;color:var(--muted)}
  .bubbles .b .v{font-size:15px;font-weight:900;margin-top:2px}
  .bars{display:flex;gap:10px;padding:0 18px 14px}
  .bars .bar{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
  .bars .bar .v{font-size:16px;font-weight:900}
  .bars .bar .l{font-size:10px;color:var(--muted);margin-top:2px}
  .bars .bar .track{height:5px;background:var(--surface-2);border-radius:99px;margin-top:8px;overflow:hidden}
  .bars .bar .track i{display:block;height:100%;background:var(--run-grad);border-radius:99px}
  .pills2{display:flex;gap:10px;padding:0 18px 12px}
  .pills2 .p{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:800;font-size:13px;color:var(--ink-2);cursor:pointer}
  .pills2 .p.on{background:var(--run-grad);color:#fff;border-color:transparent}
  .nav4{background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:14px 0 16px}
  .nav4 .i{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
  .nav4 .i.on{color:var(--run)}

  /* Help */
  .help-q{margin:4px 16px 10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
  .help-q .t{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
  .help-q .t .n{width:22px;height:22px;border-radius:7px;background:var(--run-grad);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .help-q .a{color:var(--muted);font-size:12.5px;line-height:1.7;margin-top:8px}
  .help-tabs{display:flex;gap:14px;padding:6px 18px}
  .help-tabs .t{font-size:13px;color:var(--muted);font-weight:700}
  .help-tabs .t.on{color:var(--ink);border-bottom:2px solid var(--run);padding-bottom:6px}
  .help-act{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer}
  .help-act .ic{width:44px;height:44px;border-radius:12px;background:var(--run-grad);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
  .help-act .ct .t{font-weight:800;font-size:13.5px}
  .help-act .ct .d{color:var(--muted);font-size:11px;margin-top:2px}
  .help-act .go{margin-left:auto;color:var(--run);font-weight:800;font-size:12px}
  .help-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
  .help-cards .c{border-radius:16px;overflow:hidden;height:110px;position:relative;cursor:pointer}
  .help-cards .c img{width:100%;height:100%;object-fit:cover}
  .help-cards .c span{position:absolute;left:10px;bottom:8px;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5)}

  /* Diet */
  .diet-ring{margin:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;align-items:center;gap:14px}
  .diet-ring .ring{width:78px;height:78px;flex-shrink:0;position:relative}
  .diet-ring .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .diet-ring .ring .ctr .v{font-size:16px;font-weight:900}
  .diet-ring .ring .ctr .l{font-size:9px;color:var(--muted)}
  .diet-ring .info .t{font-size:13px;color:var(--ink-2);font-weight:700}
  .diet-ring .info .sub{font-size:11px;color:var(--muted);margin-top:4px}
  .diet-ring .info .sub b{color:var(--run-2)}
  .mtabs{display:flex;gap:8px;padding:0 16px 4px}
  .mtabs .t{font-size:12px;color:var(--muted);font-weight:700;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
  .mtabs .t.on{background:var(--run-grad);color:#fff;border-color:transparent}
  .meal{display:flex;align-items:center;gap:12px;margin:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
  .meal .th{width:56px;height:56px;border-radius:12px;overflow:hidden;flex-shrink:0}
  .meal .th img{width:100%;height:100%;object-fit:cover}
  .meal .ct .t{font-weight:800;font-size:13.5px}
  .meal .ct .m{font-size:10px;color:var(--muted);margin-top:2px}
  .meal .ct .mac{display:flex;gap:6px;margin-top:5px}
  .meal .ct .mac span{font-size:9px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 6px}
  .meal .kcal{margin-left:auto;text-align:right}
  .meal .kcal .v{font-size:15px;font-weight:900;color:var(--run-2)}
  .meal .kcal .l{font-size:9px;color:var(--muted)}

  /* Video detail */
  .vplayer{height:210px;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .vplayer .vback{position:absolute;top:10px;left:10px;z-index:4;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
  .vplayer .vback svg{width:18px;height:18px}
  .vplayer img{width:100%;height:100%;object-fit:cover;opacity:.62}
  .vplayer .vp-btn{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);border:1.5px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
  .vplayer .vp-btn svg{width:28px;height:28px;fill:#fff;stroke:#fff}
  .vplayer .vp-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
  .vplayer .vp-bar i{display:block;height:100%;width:0;background:var(--run)}
  .vtitle{padding:14px 18px 4px;font-size:18px;font-weight:900;line-height:1.4}
  .vmeta{padding:0 18px;color:var(--muted);font-size:11px;display:flex;gap:14px}
  .vauthor{display:flex;align-items:center;gap:10px;padding:14px 18px;margin-top:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .vauthor .nm{font-weight:800;font-size:14px}
  .vauthor .mt{color:var(--muted);font-size:11px;margin-top:2px}
  .vauthor .follow{margin-left:auto;background:var(--run-grad);color:#fff;font-size:11px;font-weight:800;padding:7px 16px;border-radius:999px;cursor:pointer}
  .vacts{display:flex;justify-content:space-around;padding:14px 18px;border-bottom:1px solid var(--line)}
  .vacts .a{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-2);font-size:11px;font-weight:700;cursor:pointer}
  .vacts .a.liked{color:var(--run)}
  .vdesc{padding:14px 18px;color:var(--ink-2);font-size:13px;line-height:1.7}

  /* Onboarding guide */
  .guide-mask{position:absolute;inset:0;z-index:80;pointer-events:none}
  .guide-mask .hole{position:absolute;border:2px solid var(--run);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);transition:all .35s ease;pointer-events:none}
  .guide-tip{position:absolute;z-index:82;left:16px;right:16px;background:var(--surface);border:1px solid var(--run);border-radius:18px;padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.6);transition:top .35s ease}
  .guide-tip .step{color:var(--run);font-size:11px;font-weight:800;letter-spacing:1px}
  .guide-tip .gt{font-size:14px;font-weight:800;margin-top:6px;line-height:1.5}
  .guide-tip .gd{color:var(--ink-2);font-size:12px;margin-top:6px;line-height:1.6}
  .guide-tip .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .guide-tip .skip{font-size:12px;color:var(--muted);cursor:pointer;padding:8px}
  .guide-tip .next{background:var(--run-grad);color:#fff;font-size:13px;font-weight:800;padding:9px 22px;border-radius:999px;cursor:pointer}
  .guide-dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .guide-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .guide-dots i.on{width:18px;background:var(--run);border-radius:4px}

  /* toast */
  .toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:999px;z-index:90;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* 社区子页 */
  .topic-hero{height:170px;position:relative;overflow:hidden}
  .topic-hero img{width:100%;height:100%;object-fit:cover}
  .topic-hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(5,7,10,.85));display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px}
  .topic-hero .ov .tag{color:var(--run-2);font-size:12px;font-weight:700}
  .topic-hero .ov .tt{color:#fff;font-size:22px;font-weight:900;margin-top:3px}
  .topic-hero .ov .sub{color:rgba(255,255,255,.75);font-size:11px;margin-top:5px}
  .join-bar{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .join-bar .info{flex:1}
  .join-bar .info .n{font-size:14px;font-weight:800}
  .join-bar .info .d{font-size:11px;color:var(--muted);margin-top:2px}
  .join-btn{background:var(--run-grad);color:#fff;font-size:13px;font-weight:800;padding:10px 22px;border-radius:999px;cursor:pointer;box-shadow:0 6px 16px rgba(255,84,54,.3)}
  .join-btn.joined{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);box-shadow:none}
  .feed-card{margin:0 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;cursor:pointer}
  .feed-card .fh{display:flex;align-items:center;gap:9px}
  .feed-card .fh .name{font-weight:800;font-size:13px}
  .feed-card .fh .meta{color:var(--muted);font-size:10.5px}
  .feed-card .ft{font-size:13.5px;line-height:1.55;margin:9px 0}
  .feed-card .fimgs{display:flex;gap:5px;margin-top:8px}
  .feed-card .fimgs .fi{flex:1;height:88px;border-radius:10px;overflow:hidden}
  .feed-card .fimgs .fi img{width:100%;height:100%;object-fit:cover}
  .feed-card .fs{display:flex;gap:20px;margin-top:11px;color:var(--ink-2);font-size:11.5px}
  .feed-card .fs span{display:flex;align-items:center;gap:5px}
  .compose-area{padding:14px 18px}
  .compose-area .ta{width:100%;min-height:110px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);font-size:14px;padding:14px;resize:none;outline:none;line-height:1.6;font-family:inherit}
  .compose-area .ta::placeholder{color:var(--muted)}
  .compose-tools{display:flex;gap:18px;padding:2px 18px 12px;color:var(--ink-2)}
  .compose-tools .tool{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;cursor:pointer}
  .compose-tools .tool .ci{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--run-2)}
  .compose-photos{display:flex;gap:8px;padding:4px 18px 16px}
  .compose-photos .ph{width:76px;height:76px;border-radius:12px;overflow:hidden;position:relative}
  .compose-photos .ph img{width:100%;height:100%;object-fit:cover}
  .compose-photos .ph .x{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .detail-hero{height:260px;position:relative}
  .detail-hero img{width:100%;height:100%;object-fit:cover}
  .detail-body{padding:16px 18px}
  .detail-body h3{font-size:19px;line-height:1.4}
  .detail-body .txt{font-size:14px;line-height:1.75;color:var(--ink-2);margin-top:12px}
  .detail-body .tags{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  /* ---- 社区分类页 (推荐/附近/话题) ---- */
  .cbanner{margin:14px 16px 0;height:148px;border-radius:18px;overflow:hidden;position:relative;cursor:pointer}
  .cbanner img{width:100%;height:100%;object-fit:cover}
  .cbanner .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(5,7,10,.88));display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px}
  .cbanner .ov .tag{align-self:flex-start;background:var(--run-grad);color:#fff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:8px}
  .cbanner .ov .tt{color:#fff;font-size:18px;font-weight:900;line-height:1.3}
  .cbanner .ov .ds{color:rgba(255,255,255,.75);font-size:11px;margin-top:4px}
  .loc-bar{display:flex;align-items:center;gap:7px;margin:14px 16px 2px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--ink-2)}
  .loc-bar b{color:var(--ink);font-weight:800}
  .loc-bar .sw{margin-left:auto;color:var(--run);font-weight:700;cursor:pointer}
  .rank-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .rank-row .no{width:22px;font-size:17px;font-weight:900;color:var(--muted);font-style:italic;text-align:center;flex-shrink:0}
  .rank-row .no.top{color:var(--run)}
  .rank-row .thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--surface-2)}
  .rank-row .thumb img{width:100%;height:100%;object-fit:cover}
  .rank-row .ct{flex:1;min-width:0}
  .rank-row .ct .t{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-row .ct .d{color:var(--muted);font-size:10.5px;margin-top:3px}
  .rank-row .hot{color:var(--run);font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px;flex-shrink:0}
  .people-strip{display:flex;gap:10px;padding:2px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .people-strip::-webkit-scrollbar{display:none}
  .pcard{flex:0 0 108px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer}
  .pcard .av{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
  .pcard .nm{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .ds{color:var(--muted);font-size:10px;margin:3px 0 9px}
  .pcard .fb{background:var(--run-grad);color:#fff;font-size:10.5px;font-weight:800;padding:5px 0;border-radius:999px}
  .pcard .fb.following{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .person-row{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
  .person-row .av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
  .person-row .ct{flex:1;min-width:0}
  .person-row .ct .n{font-size:13px;font-weight:800}
  .person-row .ct .d{color:var(--muted);font-size:10.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .ev-row .ct .t{font-size:13.5px;font-weight:800}

// 线上分享链接要求每个静态资源也带 sharecode，否则返回 403「链接不完整」。
// 本地 file:// 打开时地址里没有该参数，保持原路径；两种环境都能正常显示图片。
(function(){
  let sc=''; try{ sc = new URLSearchParams(location.search).get('sharecode') || ''; }catch(e){}
  if(!sc) return;
  Object.keys(A).forEach(k=>{
    if(A[k].indexOf('data:')===0) return;  // 单文件版内嵌图不需要
    A[k] += (A[k].indexOf('?')<0 ? '?' : '&') + 'sharecode=' + encodeURIComponent(sc);
  });
})();

        <div class="a" id="vlike" onclick="videoLike()"><svg class="ic"><use href="#i-heart"/></svg><span id="vlikeN">${d.likes}</span></div>
        <div class="a" ><svg class="ic"><use href="#i-comment"/></svg><span>${d.comments}</span></div>
        <div class="a" id="vstar" onclick="videoStar()"><svg class="ic"><use href="#i-star"/></svg><span>收藏</span></div>
        <div class="a" ><svg class="ic"><use href="#i-share"/></svg><span>分享</span></div>
      </div>
      <div class="vdesc">${d.desc}</div>
      <div class="section-title pad">接下来播放 <span class="more" >更多 ›</span></div>
      <div class="vcarousel">
        ${['hiit','yoga','strength','cycling'].filter(k=>k!==currentVideo).map(k=>{const x=VIDEO_DATA[k];return `<div class="vcard" onclick="openVideo('${k}')"><div class="th">${img(x.img)}<div class="play"><svg class="ic xs"><use href="#i-play"/></svg></div><div class="dur">${x.dur}</div></div><div class="ct"><div class="t">${x.title}</div><div class="a">${x.author}</div></div></div>`}).join('')}
      </div>
      <div style="height:14px"></div>
    </div>`;
  }
};

// ---------- video data ----------
const VIDEO_DATA = {
  hiit:{img:'hiit',title:'HIIT 燃脂 20 分钟',author:'Lisa',role:'健身教练',fans:'128k',views:'86.2万',date:'3 天前',dur:'12:30',likes:'3.2万',comments:'864',av:'a1',desc:'全程站立、无跳跃的低冲击 HIIT，跟着节奏完成 4 组循环，燃脂同时保护膝盖。适合有一定基础、想高效减脂的同学。记得训练前后补充水分。'},
  yoga:{img:'yoga',title:'晨间瑜伽拉伸',author:'Anna',role:'瑜伽导师',fans:'95k',views:'52.8万',date:'1 周前',dur:'08:15',likes:'2.1万',comments:'392',av:'a3',desc:'唤醒身体的 8 分钟晨间序列，从猫牛式到拜日式，柔和打开肩颈与髋部。起床后、工作间隙都能练，让一天从舒展开始。'},
  strength:{img:'strength',title:'居家力量训练',author:'教练王',role:'力量训练教练',fans:'203k',views:'134万',date:'5 天前',dur:'15:40',likes:'5.6万',comments:'1.2k',av:'a2',desc:'无需器械的自重力量训练，深蹲、俯卧撑、臀桥全覆盖。每个动作详细讲解发力要点，练出扎实的力量基础。'}
};
const VIDEO_DATA_EXTRA = {
  cycling:{img:'cycling',title:'城市骑行 Vlog',author:'阿May',role:'骑行博主',fans:'42k',views:'31.5万',date:'2 周前',dur:'06:50',likes:'9800',comments:'168',av:'a4',desc:'沿着江边骑行的清晨 Vlog，记录城市苏醒的样子。带上水壶和好心情，一起出发。'}
};
Object.assign(VIDEO_DATA, VIDEO_DATA_EXTRA);
let currentVideo = 'hiit';
let videoTimer = null, videoPlaying = false;

// ---------- navigation ----------
const ENTRY = ['wall','flash','start'];
let state = 'wall';
let stack = [];
let flashTimer = null;
const viewEl = document.getElementById('view');
const tabEl = document.getElementById('tabbar');

const TABS = [
  {key:'home', label:'首页', icon:'i-home'},
  {key:'community', label:'社区', icon:'i-chat'},
  {key:'train', label:'RUN', icon:'center'},
  {key:'data', label:'数据', icon:'i-data'},
  {key:'profile', label:'我的', icon:'i-user'}
];

function renderTabbar(){
  tabEl.innerHTML = TABS.map(t=>{
    if(t.icon==='center'){
      return `<div class="center" onclick="setMain('training')"><div class="fab">RUN</div></div>`;
    }
    const active = (state===t.key)?' active':'';
    return `<div class="item${active}" onclick="setMain('${t.key}')"><svg class="ic"><use href="#${t.icon}"/></svg><span>${t.label}</span></div>`;
  }).join('');
}

function render(name){
  if(name) state = name;
  if(flashTimer){clearTimeout(flashTimer);flashTimer=null;}
  if(videoTimer){clearInterval(videoTimer);videoTimer=null;videoPlaying=false;}
  if(state!=='home' && guideActive) endGuide();
  viewEl.innerHTML = VIEWS[state]();
  // 训练页从「我的」卡片进入时显示返回栏；从底部导航进入则不显示（避免与底部导航重复）
  const tb = document.getElementById('trainBack');
  if(tb) tb.style.display = stack.length ? 'flex' : 'none';

  // 壁纸/闪屏/启动页背景深，状态栏文字用白色
  const sbEl = document.getElementById('statusbar');
  if(sbEl) sbEl.classList.toggle('light', state==='wall'||state==='flash'||state==='start');
  const hidden = ENTRY.includes(state);
  tabEl.style.display = hidden ? 'none' : 'flex';
  if(!hidden) renderTabbar();
  viewEl.scrollTop = 0;
  if(state==='flash'){
    flashTimer = setTimeout(()=>render('start'),3000);
  }
  // first-time onboarding guide on home (only ever once)
  if(state==='home' && !guideActive && !guideEverShown){
    let guided=false;
    try{ guided = (localStorage.getItem('run_guided')==='1') || (sessionStorage.getItem('run_guided')==='1'); }catch(e){}
    if(!guided){ setTimeout(startGuide, 500); }
  }
}
function go(name){ stack.push(state); render(name); }
function back(){ if(stack.length){ render(stack.pop()); } else { render('profile'); } }
function setMain(name){ stack=[]; render(name); }
function goFlash(){ render('flash'); }
function enterApp(){ stack=[]; render('home'); }
function mealSwitch(el){ document.querySelectorAll('.mtabs .t').forEach(x=>x.classList.remove('on')); el.classList.add('on'); }
function dietSwitch(el){ document.querySelectorAll('.pills2 .p').forEach(x=>x.classList.remove('on')); el.classList.add('on'); }

// tab switching (首页顶部分类)
function tabSwitch(box,ev){
  const t = ev.target.closest('.t'); if(!t) return;
  box.querySelectorAll('.t').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
}
// 社区四个分类页切换（只换内容区，不整页重绘，保持滚动与状态）
function setCommunityTabFromEvent(box,ev){
  const t = ev.target.closest('.t'); if(!t) return;
  setCommunityTab(t.dataset.ct || t.textContent);
}
function setCommunityTab(name){
  if(!COMM_TABS[name]) return;
  communityTab = name;
  const box = document.getElementById('communityTabs');
  if(box) box.querySelectorAll('.t').forEach(x=>x.classList.toggle('on', (x.dataset.ct||x.textContent)===name));
  const body = document.getElementById('communityBody');
  if(body) body.innerHTML = COMM_TABS[name]();
  const vp = document.getElementById('view'); if(vp) vp.scrollTop = 0;
}
function tagPick(ev){
  const c = ev.target.closest('.chip'); if(!c) return;
  c.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
}
function smallJoin(el){
  if(el.textContent==='已参与'){ el.textContent='参与'; el.style.background=''; toast('已退出话题'); }
  else{ el.textContent='已参与'; el.style.background='var(--surface-2)'; toast('参与成功 ✓'); }
}
// follow button toggle
function followToggle(el){
  if(el.classList.contains('following')){ el.classList.remove('following'); el.textContent='+ 关注'; toast('已取消关注'); }
  else{ el.classList.add('following'); el.textContent='✓ 已关注'; toast('关注成功 ✓'); }
}
// like toggle on posts
function likeToggle(el,base){
  const b = el.querySelector('b');
  if(el.classList.contains('liked')){ el.classList.remove('liked'); b.textContent = base>1000?(base/1000).toFixed(1)+'k':base; }
  else{ el.classList.add('liked'); b.textContent = base>=1000?(base/1000).toFixed(1)+'k':base+1; }
}
// open video detail
function openVideo(key){ currentVideo=key; videoPlaying=false; go('video'); }
function videoPlayToggle(){
  const btn=document.getElementById('vpBtn'), bar=document.getElementById('vpBar');
  if(!btn) return;
  if(videoPlaying){ videoPlaying=false; btn.innerHTML='<svg viewBox="0 0 24 24"><use href="#i-play"/></svg>'; if(videoTimer){clearInterval(videoTimer);videoTimer=null;} toast('已暂停'); }
  else{ videoPlaying=true; btn.innerHTML='<svg viewBox="0 0 24 24"><use href="#i-pause"/></svg>'; toast('播放中 ▶');
    let w=parseFloat(bar.style.width)||0;
    videoTimer=setInterval(()=>{ w+=2; if(w>=100){w=0;} bar.style.width=w+'%'; },180);
  }
}
function videoLike(){ const el=document.getElementById('vlike'),n=document.getElementById('vlikeN'); if(el.classList.contains('liked')){el.classList.remove('liked');toast('已取消点赞');}else{el.classList.add('liked');toast('点赞成功 ❤️');} }
function videoStar(){ const el=document.getElementById('vstar'); if(el.classList.contains('liked')){el.classList.remove('liked');toast('已取消收藏');}else{el.classList.add('liked');toast('已收藏 ⭐');} }

// 社区子页交互
function topicJoinToggle(){
  const el=document.getElementById('topicJoin'); if(!el) return;
  if(el.classList.contains('joined')){ el.classList.remove('joined'); el.textContent='+ 参与话题'; toast('已退出话题'); }
  else{ el.classList.add('joined'); el.textContent='✓ 已参与'; toast('参与成功，开始打卡吧 🎉'); }
}
function publishPost(){
  const ta=document.getElementById('composeText');
  if(!ta || !ta.value.trim()){ toast('先写点内容吧～'); return; }
  toast('发布成功 ✓'); setTimeout(()=>back(), 700);
}
function addPhoto(){
  const box=document.getElementById('composePhotos'); if(!box) return;
  const keys=['run','strength','food','cycling'];
  const k=keys[box.children.length % keys.length];
  const d=document.createElement('div'); d.className='ph';
  d.innerHTML=img(k)+'<div class="x" onclick="this.parentNode.remove()">×</div>';

// ---------- onboarding guide ----------
const GUIDE_STEPS = [
  {sel:'#gd-quick', title:'快速记录，养成习惯', desc:'首页顶部这一排，可以记录饮食、喝水、打卡和睡眠，点一下就能记。'},
  {sel:'#gd-video-list', title:'视频课程，点开就练', desc:'这里是我们推荐的跟练视频，点任意一张卡片就能进入播放页，边看边练。'},
  {sel:'#tabbar', title:'底部导航，随心切换', desc:'用底部这 5 个按钮在首页、社区、训练、数据、我的之间切换，中间红色 RUN 直接进入训练。'}
];
let guideStep = 0, guideActive = false, guideEverShown = false;
function markGuided(){
  guideEverShown = true;
  try{ localStorage.setItem('run_guided','1'); }catch(e){}
  try{ sessionStorage.setItem('run_guided','1'); }catch(e){}
}
function startGuide(){
  if(guideEverShown || state!=='home') return;
  markGuided();
  guideStep = 0; guideActive = true;
  document.getElementById('guide').style.display='block';
  document.getElementById('guideTip').style.display='block';
  document.getElementById('gdots').innerHTML = GUIDE_STEPS.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
  positionGuide();
}
function positionGuide(){
  const s = GUIDE_STEPS[guideStep];
  const target = document.querySelector(s.sel);
  if(!target){ endGuide(); return; }
  // scroll target into the center of the scrollable view first
  if(viewEl.contains(target)){
    const tr = target.getBoundingClientRect(), vr = viewEl.getBoundingClientRect();
    const want = viewEl.scrollTop + (tr.top - vr.top) - (vr.height - tr.height)/2;
    viewEl.scrollTop = Math.max(0, want);
  }
  const vpRect = viewEl.parentElement.getBoundingClientRect();
  const r = target.getBoundingClientRect();
  const hole = document.getElementById('guideHole');
  const pad = 6;
  const hl = Math.max(pad, r.left - vpRect.left - pad);
  const ht = Math.max(pad, r.top - vpRect.top - pad);
  const hw = Math.min(r.width + pad*2, vpRect.width - hl - pad);
  const hh = Math.min(r.height + pad*2, vpRect.height - ht - pad);
  hole.style.left = hl+'px'; hole.style.top = ht+'px';
  hole.style.width = hw+'px'; hole.style.height = hh+'px';
  document.getElementById('gstep').textContent = '新手引导 · '+(guideStep+1)+' / '+GUIDE_STEPS.length;
  document.getElementById('gtitle').textContent = s.title;
  document.getElementById('gdesc').textContent = s.desc;
  document.getElementById('gnext').textContent = guideStep===GUIDE_STEPS.length-1 ? '开始使用' : '下一步';
  document.querySelectorAll('#gdots i').forEach((d,i)=>d.className = i===guideStep?'on':'');
  // place tip below the highlighted area if room, otherwise above
  const tip = document.getElementById('guideTip');
  const screenH = vpRect.height;
  const holeBottom = ht + hh;
  const tipH = 152;
  let tipTop;
  if(holeBottom + tipH + 10 <= screenH) tipTop = holeBottom + 12;
  else if(ht - tipH - 10 >= 8) tipTop = ht - tipH - 12;
  else tipTop = Math.max(8, screenH - tipH - 8);
  tip.style.top = tipTop+'px';
}
function nextGuide(){
  if(guideStep < GUIDE_STEPS.length-1){ guideStep++; positionGuide(); }
  else endGuide();
}
function endGuide(){
  guideActive=false;
  markGuided();
  document.getElementById('guide').style.display='none';
  document.getElementById('guideTip').style.display='none';
}
window.addEventListener('resize',()=>{ if(guideActive) positionGuide(); });

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1400);
}

// start at wallpaper
render('wall');
</script>
